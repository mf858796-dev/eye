# Server Configuration
server.port=8080
server.servlet.context-path=/eye-tracking

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/eye_tracking_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL5Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false

# Demo Admin Account
app.admin.username=admin
app.admin.password=admin
app.admin.name=系统管理员
app.admin.email=admin@example.com

# Tobii Pro Glasses 3
tobii.glasses.base-url=http://192.168.71.50:8080
