# Server Configuration
server.port=8080
server.servlet.context-path=/eye-tracking

# Database Configuration
# Development uses an embedded H2 database so the project can run immediately.
spring.datasource.url=jdbc:h2:mem:eye_tracking_system;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false

# Demo Admin Account
app.admin.username=admin
app.admin.password=admin
app.admin.name=系统管理员
app.admin.email=admin@example.com

# Tobii Pro Glasses 3
tobii.glasses.base-url=http://192.168.71.50:8080
