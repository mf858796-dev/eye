# Server Configuration
server.port=8080
server.servlet.context-path=/eye-tracking

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eye_tracking_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL5Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=true

# Initial Admin Account
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin}
app.admin.name=${APP_ADMIN_NAME:系统管理员}
app.admin.email=${APP_ADMIN_EMAIL:admin@example.com}

# Tobii Pro Glasses 3
tobii.glasses.base-url=${TOBII_GLASSES_BASE_URL:http://192.168.71.50:8080}

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.eyetracking=INFO
