<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>训练记录 - 眼动仪训练系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page-shell">
    <div class="page-head">
        <div><h1 class="page-title">训练记录</h1><p class="page-copy">查看训练会话、分析报告和历史进度。</p></div>
        <div class="toolbar"><a th:href="@{/training/code-examples}" class="btn btn-primary"><i class="bi bi-play-fill"></i> 开始训练</a><a th:href="@{/dashboard}" class="btn btn-outline-secondary"><i class="bi bi-grid-1x2"></i> 系统总览</a></div>
    </div>
    <div th:if="${message}" class="alert alert-success"><span th:text="${message}"></span></div>
    <section class="panel">
        <div th:if="${#lists.isEmpty(sessions)}" class="empty-state">暂无训练记录，可以从题库选择一个关卡开始。</div>
        <div th:unless="${#lists.isEmpty(sessions)}" class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>会话名称</th><th>开始时间</th><th>结束时间</th><th>时长</th><th>状态</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="trainingSession : ${sessions}">
                    <td th:text="${trainingSession.sessionName}">代码阅读训练</td>
                    <td th:text="${trainingSession.startTime}">-</td>
                    <td th:text="${trainingSession.endTime != null ? trainingSession.endTime : '未结束'}">未结束</td>
                    <td th:text="${trainingSession.duration != null ? trainingSession.duration + ' 分钟' : '进行中'}">进行中</td>
                    <td><span th:if="${trainingSession.status == 'ACTIVE'}" class="badge bg-warning text-dark">进行中</span><span th:unless="${trainingSession.status == 'ACTIVE'}" class="badge bg-success">已完成</span></td>
                    <td><div class="d-flex flex-wrap gap-2"><a th:href="@{/training/detail/{id}(id=${trainingSession.id})}" class="btn btn-sm btn-outline-primary">详情</a><a th:if="${trainingSession.status == 'COMPLETED'}" th:href="@{/training/report/{id}(id=${trainingSession.id})}" class="btn btn-sm btn-primary">报告</a><form th:action="@{/training/delete/{id}(id=${trainingSession.id})}" method="post" class="d-inline" onsubmit="return confirm('确定要删除这条训练记录吗？')"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="btn btn-sm btn-outline-danger">删除</button></form></div></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
