<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开始训练 - 眼动仪训练系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page-shell">
    <div class="page-head">
        <div><h1 class="page-title">开始训练</h1><p class="page-copy">选择一个代码阅读关卡，进入全屏训练页面。</p></div>
        <div class="toolbar"><a th:href="@{/training/levels}" class="btn btn-outline-primary"><i class="bi bi-journal-code"></i> 管理题库</a><a th:href="@{/dashboard}" class="btn btn-outline-secondary"><i class="bi bi-grid-1x2"></i> 系统总览</a></div>
    </div>
    <div th:if="${error}" class="alert alert-danger"><span th:text="${error}"></span></div>
    <div th:if="${message}" class="alert alert-success"><span th:text="${message}"></span></div>

    <section class="panel mb-3">
        <form th:action="@{/training/code-examples}" method="get" class="filter-grid">
            <div><label for="language" class="form-label">编程语言</label><select class="form-select" id="language" name="language"><option value="all" th:selected="${selectedLanguage == 'all'}">全部</option><option value="java" th:selected="${selectedLanguage == 'java'}">Java</option><option value="python" th:selected="${selectedLanguage == 'python'}">Python</option><option value="javascript" th:selected="${selectedLanguage == 'javascript'}">JavaScript</option></select></div>
            <div><label for="difficulty" class="form-label">难度</label><select class="form-select" id="difficulty" name="difficulty"><option value="all" th:selected="${selectedDifficulty == 'all'}">全部</option><option value="easy" th:selected="${selectedDifficulty == 'easy'}">简单</option><option value="medium" th:selected="${selectedDifficulty == 'medium'}">中等</option><option value="hard" th:selected="${selectedDifficulty == 'hard'}">困难</option></select></div>
            <div class="toolbar"><button type="submit" class="btn btn-primary"><i class="bi bi-funnel"></i> 筛选</button><a th:href="@{/training/code-examples}" class="btn btn-outline-secondary">重置</a></div>
        </form>
    </section>

    <div class="d-flex align-items-center justify-content-between mb-3"><span class="soft-badge" th:text="'共 ' + ${resultCount} + ' 个关卡'">共 0 个关卡</span></div>
    <div th:if="${#lists.isEmpty(codeExamples)}" class="panel empty-state">没有匹配的训练关卡，请调整筛选条件。</div>

    <section th:unless="${#lists.isEmpty(codeExamples)}" class="code-grid">
        <article th:each="codeExample : ${codeExamples}" class="record-card">
            <div class="d-flex align-items-start justify-content-between gap-2">
                <div><h3 th:text="${codeExample.title}">训练关卡</h3><p class="muted-copy mb-0" th:text="${codeExample.description}">关卡说明</p></div>
                <span th:if="${codeExample.difficulty == 'easy'}" class="badge bg-success">简单</span><span th:if="${codeExample.difficulty == 'medium'}" class="badge bg-warning text-dark">中等</span><span th:if="${codeExample.difficulty == 'hard'}" class="badge bg-danger">困难</span>
            </div>
            <div class="record-meta"><span class="soft-badge" th:text="${codeExample.language}">java</span><span class="soft-badge" th:text="${codeExample.levelNumber != null ? '关卡 ' + codeExample.levelNumber : '未编号'}">关卡</span><span class="soft-badge warning" th:text="${codeExample.taskType}">highlight_follow</span></div>
            <p class="muted-copy mb-2">目标行：<span th:text="${codeExample.targetLines != null && !#strings.isEmpty(codeExample.targetLines) ? codeExample.targetLines : '未设置'}">未设置</span></p>
            <p class="muted-copy" th:if="${codeExample.guidance != null && !#strings.isEmpty(codeExample.guidance)}" th:text="${codeExample.guidance}"></p>
            <pre class="code-preview" th:text="${codeExample.code}"></pre>
            <div class="mt-3"><a th:href="@{/training/start/code/{codeId}(codeId=${codeExample.id})}" class="btn btn-primary w-100"><i class="bi bi-play-fill"></i> 开始训练</a></div>
        </article>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
