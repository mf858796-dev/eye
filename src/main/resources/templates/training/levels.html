<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>训练题库 - 眼动仪训练系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page-shell">
    <div class="page-head">
        <div><h1 class="page-title">训练题库</h1><p class="page-copy">维护代码阅读关卡、目标行和训练类型。</p></div>
        <div class="toolbar"><a th:href="@{/training/levels/new}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> 新增关卡</a><a th:href="@{/training/code-examples}" class="btn btn-outline-secondary"><i class="bi bi-play-circle"></i> 开始训练</a></div>
    </div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <section class="panel">
        <div th:if="${#lists.isEmpty(levels)}" class="empty-state">暂无训练关卡，请先新增。</div>
        <div class="table-responsive" th:if="${!#lists.isEmpty(levels)}">
            <table class="table table-hover align-middle">
                <thead><tr><th>关卡</th><th>内容</th><th>类型</th><th>语言/难度</th><th>状态</th><th>操作</th></tr></thead>
                <tbody>
                <tr th:each="level : ${levels}">
                    <td th:text="${level.levelNumber}">1</td>
                    <td><strong th:text="${level.title}">关卡标题</strong><div class="muted-copy small" th:text="${level.description}">关卡说明</div><div class="small mt-1">目标行：<span th:text="${level.targetLines != null && !#strings.isEmpty(level.targetLines) ? level.targetLines : '未设置'}"></span></div></td>
                    <td th:text="${level.taskType}">highlight_follow</td>
                    <td><span class="soft-badge" th:text="${level.language}">java</span> <span class="soft-badge warning" th:text="${level.difficulty}">easy</span></td>
                    <td><span th:if="${level.active}" class="status-pill connected">启用</span><span th:unless="${level.active}" class="status-pill disconnected">停用</span></td>
                    <td><div class="d-flex gap-2 flex-wrap"><a th:href="@{/training/levels/{id}/edit(id=${level.id})}" class="btn btn-sm btn-outline-primary">编辑</a><form th:if="${level.active}" th:action="@{/training/levels/{id}/delete(id=${level.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="btn btn-sm btn-outline-danger">停用</button></form><form th:if="${!level.active}" th:action="@{/training/levels/{id}/activate(id=${level.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="btn btn-sm btn-outline-success">启用</button></form></div></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
