<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 - 眼动仪训练系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page-shell" style="max-width:780px;">
    <div class="page-head"><div><h1 class="page-title">个人资料</h1><p class="page-copy">维护账号基础信息。</p></div><div class="toolbar"><a th:href="@{/dashboard}" class="btn btn-outline-secondary"><i class="bi bi-grid-1x2"></i> 系统总览</a></div></div>
    <section class="panel">
        <div th:if="${message}" class="alert alert-success"><span th:text="${message}"></span></div>
        <div th:if="${error}" class="alert alert-danger"><span th:text="${error}"></span></div>
        <form th:action="@{/user/profile/update}" th:object="${user}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3"><label for="username" class="form-label">用户名</label><input type="text" class="form-control" id="username" th:field="*{username}" disabled></div>
            <div class="mb-3"><label for="name" class="form-label">姓名</label><input type="text" class="form-control" id="name" th:field="*{name}" required></div>
            <div class="mb-3"><label for="email" class="form-label">邮箱</label><input type="email" class="form-control" id="email" th:field="*{email}" required></div>
            <div class="mb-4"><label for="role" class="form-label">角色</label><input type="text" class="form-control" id="role" th:field="*{role}" disabled></div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> 保存资料</button>
        </form>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
