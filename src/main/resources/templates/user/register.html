<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 眼动仪训练系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-intro">
            <p class="auth-kicker">Create Account</p>
            <h1>建立个人训练档案</h1>
            <p>账号用于保存训练记录、报告结果、题库进度和个性化设置。</p>
        </section>

        <section class="auth-card">
            <h2 class="auth-title">注册</h2>
            <p class="auth-subtitle">填写基础信息后即可开始训练。</p>

            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/user/register}" th:object="${user}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label for="username" class="form-label">用户名</label>
                    <input type="text" class="form-control" id="username" th:field="*{username}" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">密码</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}" autocomplete="new-password" minlength="6" required>
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">姓名</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" autocomplete="name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">邮箱</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}" autocomplete="email" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">创建账号</button>
            </form>

            <div class="mt-3 text-center">
                <span class="text-muted">已有账号？</span>
                <a th:href="@{/user/login}">登录</a>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
