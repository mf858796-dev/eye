<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置 - 眼动仪训练系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page-shell">
    <div class="page-head">
        <div><h1 class="page-title">系统设置</h1><p class="page-copy">配置眼动仪连接、训练参数和数据导出方式。</p></div>
        <div class="toolbar"><a th:href="@{/tobii/test}" class="btn btn-outline-primary"><i class="bi bi-usb-symbol"></i> 眼动仪连接</a><a th:href="@{/dashboard}" class="btn btn-outline-secondary"><i class="bi bi-grid-1x2"></i> 系统总览</a></div>
    </div>
    <div th:if="${message}" class="alert alert-success"><span th:text="${message}"></span></div>
    <form th:action="@{/settings}" method="post" class="panel">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <h2 class="panel-title">眼动仪配置</h2>
        <div class="row g-3 mb-4">
            <div class="col-md-6"><label for="deviceType" class="form-label">设备类型</label><select class="form-select" id="deviceType" name="deviceType"><option value="glasses" th:selected="${deviceType == 'glasses'}">Tobii Pro Glasses 3（HTTP API）</option><option value="screen" th:selected="${deviceType == 'screen'}">笔记本屏幕式眼动仪（本地 SDK 桥接）</option></select></div>
            <div class="col-md-6"><label for="calibrationPointCount" class="form-label">校准点数</label><select class="form-select" id="calibrationPointCount" name="calibrationPointCount"><option value="9" th:selected="${calibrationPointCount == 9}">9 点精细校准</option><option value="5" th:selected="${calibrationPointCount == 5}">5 点快速校准</option></select></div>
            <div class="col-md-6"><label for="glassesAddress" class="form-label">设备地址 / SDK 桥接地址</label><input type="text" class="form-control" id="glassesAddress" name="glassesAddress" th:value="${glassesAddress}" required></div>
            <div class="col-md-6"><label for="glassesPort" class="form-label">端口号</label><input type="number" class="form-control" id="glassesPort" name="glassesPort" th:value="${glassesPort}" required></div>
            <div class="col-md-6"><label for="dataRate" class="form-label">采集频率</label><select class="form-select" id="dataRate" name="dataRate"><option value="30" th:selected="${dataRate == '30'}">30 Hz</option><option value="60" th:selected="${dataRate == '60'}">60 Hz</option><option value="120" th:selected="${dataRate == '120'}">120 Hz</option></select></div>
            <div class="col-md-6"><label for="timeout" class="form-label">连接超时</label><input type="number" class="form-control" id="timeout" name="timeout" th:value="${timeout}" required></div>
        </div>
        <h2 class="panel-title">训练参数</h2>
        <div class="row g-3 mb-4">
            <div class="col-md-6"><label for="defaultDuration" class="form-label">默认训练时长</label><input type="number" class="form-control" id="defaultDuration" name="defaultDuration" th:value="${defaultDuration}" required></div>
            <div class="col-md-6"><label for="defaultDifficulty" class="form-label">默认难度</label><select class="form-select" id="defaultDifficulty" name="defaultDifficulty"><option value="easy" th:selected="${defaultDifficulty == 'easy'}">简单</option><option value="medium" th:selected="${defaultDifficulty == 'medium'}">中等</option><option value="hard" th:selected="${defaultDifficulty == 'hard'}">困难</option></select></div>
            <div class="col-md-6"><div class="form-check"><input class="form-check-input" type="checkbox" id="autoStart" name="autoStart" th:checked="${autoStart}"><label class="form-check-label" for="autoStart">训练开始时自动采集</label></div></div>
            <div class="col-md-6"><div class="form-check"><input class="form-check-input" type="checkbox" id="showHeatmap" name="showHeatmap" th:checked="${showHeatmap}"><label class="form-check-label" for="showHeatmap">训练中显示热力图</label></div></div>
        </div>
        <h2 class="panel-title">数据与测试</h2>
        <div class="row g-3 mb-4">
            <div class="col-md-6"><label for="keepDataDays" class="form-label">数据保留天数</label><input type="number" class="form-control" id="keepDataDays" name="keepDataDays" th:value="${keepDataDays}" required></div>
            <div class="col-md-6"><label for="exportFormat" class="form-label">默认导出格式</label><select class="form-select" id="exportFormat" name="exportFormat"><option value="csv" th:selected="${exportFormat == 'csv'}">CSV</option><option value="json" th:selected="${exportFormat == 'json'}">JSON</option><option value="xml" th:selected="${exportFormat == 'xml'}">XML</option></select></div>
            <div class="col-md-6"><div class="form-check"><input class="form-check-input" type="checkbox" id="simulationMode" name="simulationMode" th:checked="${simulationMode}"><label class="form-check-label" for="simulationMode">启用模拟数据</label></div></div>
            <div class="col-md-6"><label for="simulationSpeed" class="form-label">模拟速度</label><select class="form-select" id="simulationSpeed" name="simulationSpeed"><option value="slow" th:selected="${simulationSpeed == 'slow'}">慢速</option><option value="normal" th:selected="${simulationSpeed == 'normal'}">正常</option><option value="fast" th:selected="${simulationSpeed == 'fast'}">快速</option></select></div>
        </div>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> 保存设置</button>
    </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
